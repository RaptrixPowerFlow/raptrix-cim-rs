name: Auto release tag

# Creates an annotated semver tag (vX.Y.Z) from the root Cargo.toml [package]
# version when it is missing on origin, then pushes it.
#
# GitHub does **not** start new workflows from a ``push`` performed with the
# default ``GITHUB_TOKEN``. Tag pushes from this job therefore **do not** fire
# ``release.yml`` on their own. After a successful tag push we call
# ``workflow_dispatch`` on ``release.yml`` (requires ``actions: write``).
#
# Backfill: Actions → Auto release tag → Run workflow (no inputs required).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If `true`, log only — do not create or push a tag"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maybe-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag decision
        id: meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_auto_tag.py

      - name: Create and push tag
        id: push_tag
        if: ${{ steps.meta.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REASON: ${{ steps.meta.outputs.reason }}
          RELEASE_PAT: ${{ secrets.GH_RELEASE_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (${REASON})"
          if [[ -n "${RELEASE_PAT}" ]]; then
            echo "used_pat=true" >> "$GITHUB_OUTPUT"
            git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          else
            echo "used_pat=false" >> "$GITHUB_OUTPUT"
            git push origin "$TAG"
          fi

      # Pushes using GITHUB_TOKEN do not trigger other workflows (including tag
      # listeners). Dispatch Release explicitly unless GH_RELEASE_PAT performed the
      # tag push (that path triggers release.yml via the tag listener).
      - name: Dispatch Release workflow on tag
        if: ${{ (steps.meta.outputs.dispatch_release == 'true' || steps.push_tag.outputs.used_pat == 'false') && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"${TAG}\",\"inputs\":{\"version\":\"${VERSION}\",\"publish_release\":\"true\",\"draft\":\"false\"}}"
