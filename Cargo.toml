[workspace]
members = ["raptrix-cim-arrow"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"

[workspace.lints.rust]
rust_2024_compatibility = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[package]
name = "raptrix-cim-rs"
version = "0.5.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "High-performance IEC 61970 Common Information Model (CIM) parser in Rust"
repository = "https://github.com/RaptrixPowerFlow/raptrix-cim-rs"
keywords = ["cim", "iec61970", "power-systems", "xml", "parser"]
categories = ["parsing", "science"]

[lints]
workspace = true

[dependencies]
quick-xml = { version = "0.39.2", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
raptrix-cim-arrow = { path = "raptrix-cim-arrow", version = "0.5.4" }

# Arrow + Parquet for zero-copy CIM → columnar data pipeline
arrow   = "58.0"
parquet = { version = "58.0", features = ["arrow"] }

# anyhow gives beginner-friendly `?` error propagation in main()
anyhow  = "1.0"
memmap2 = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"

[features]
default = []
strict = []

[dev-dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
incremental = false

